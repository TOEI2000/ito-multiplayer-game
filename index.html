<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ITO Board Game Online イト</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Card Flip Animation */
    .perspective { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // ⚙️ ตั้งค่า SUPABASE ของคุณตรงนี้
    // ==========================================
    const SUPABASE_URL = "https://jztqmxrjkmunxncjdmyw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6dHFteHJqa211bnhuY2pkbXl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjQxODIsImV4cCI6MjEwMjA0MDE4Mn0.Jzp7Rd-z1UJ01usM-HkNFYfWpmjBclihId8OZLE1Aus";

    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const AVATARS = ['🦊', '🐯', '🦁', '🐼', '🐻', '🐸', '🐙', '🦄', '🤖', '👽', '🐶', '🐱'];
    const DEFAULT_THEMES = [
      "ขนาดของสัตว์ (เล็กไปใหญ่)",
      "ระดับความน่ากลัวของผี/สิ่งสถิต",
      "ความอยากได้เป็นของขวัญวันเกิด",
      "ความสามารถในการเอาชีวิตรอดในเกาะร้าง",
      "ระดับความอร่อยของเมนูอาหารไทย",
      "ความซูเปอร์ฮีโร่ / พลังพิเศษที่อยากมี",
      "ระดับความแพงของสินค้านี้",
      "ความน่ารักของสัตว์เลี้ยง"
    ];

    const getAvatar = (name) => {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash += name.charCodeAt(i);
      return AVATARS[Math.abs(hash) % AVATARS.length];
    };

    // --- Component: หน้า Lobby ---
    function Lobby({ onJoinRoom }) {
      const [name, setName] = useState('');
      const [pin, setPin] = useState('');
      const [isCreating, setIsCreating] = useState(false);
      const [error, setError] = useState('');

      const generatePin = () => Math.floor(1000 + Math.random() * 9000).toString();

      const handleCreateRoom = async () => {
        if (!name.trim()) return setError('กรุณากรอกชื่อของคุณ');
        setError('');
        setIsCreating(true);

        const roomPin = generatePin();
        const playerId = crypto.randomUUID();

        const { error: roomError } = await db.from('rooms').insert([
          { id: roomPin, status: 'lobby', host_id: playerId }
        ]);

        if (roomError) {
          setError('ไม่สามารถสร้างห้องได้ กรุณาตรวจสอบการตั้งค่า Supabase');
          setIsCreating(false);
          return;
        }

        await db.from('players').insert([
          { id: playerId, room_id: roomPin, name: name.trim() }
        ]);

        onJoinRoom({ roomId: roomPin, playerId, isHost: true, playerName: name.trim() });
      };

      const handleJoinRoom = async () => {
        if (!name.trim()) return setError('กรุณากรอกชื่อของคุณ');
        if (pin.length !== 4) return setError('กรุณากรอก PIN 4 หลัก');
        setError('');

        const { data: room, error: roomError } = await db.from('rooms').select('*').eq('id', pin).single();
        if (roomError || !room) return setError('ไม่พบห้องหมายเลขนี้');

        const playerId = crypto.randomUUID();
        await db.from('players').insert([
          { id: playerId, room_id: pin, name: name.trim() }
        ]);

        onJoinRoom({ roomId: pin, playerId, isHost: room.host_id === playerId, playerName: name.trim() });
      };

      return (
        <div className="flex flex-col items-center justify-center min-h-screen px-4 bg-slate-900 text-white">
          <div className="w-full max-w-sm p-6 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700/80 text-center">
            <div className="text-5xl mb-2 animate-bounce">🃏</div>
            <h1 className="text-4xl font-extrabold text-amber-400 mb-1 tracking-wider">ITO イト</h1>
            <p className="text-xs text-slate-400 mb-6">เกมปาร์ตี้จัดลำดับตัวเลขลับประจำกลุ่ม (1-100)</p>

            {error && <div className="p-3 mb-4 text-xs bg-red-500/20 text-red-300 border border-red-500/50 rounded-xl">{error}</div>}

            <div className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-400 text-left mb-1">ชื่อผู้เล่น</label>
                <div className="relative">
                  <span className="absolute left-3 top-3 text-lg">{name ? getAvatar(name) : '👤'}</span>
                  <input
                    type="text"
                    placeholder="ใส่ชื่อของคุณ"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-400 text-white text-sm"
                  />
                </div>
              </div>

              <div className="pt-2 border-t border-slate-700/80">
                <button
                  onClick={handleCreateRoom}
                  disabled={isCreating}
                  className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 font-extrabold rounded-xl text-slate-950 transition-all shadow-lg shadow-amber-500/20 active:scale-95 text-sm"
                >
                  + สร้างห้องใหม่
                </button>
              </div>

              <div className="flex items-center my-2 text-slate-500 text-xs uppercase font-bold">
                <div className="flex-1 border-t border-slate-700"></div>
                <span className="px-3">หรือ เข้าร่วมห้อง</span>
                <div className="flex-1 border-t border-slate-700"></div>
              </div>

              <div className="flex gap-2">
                <input
                  type="number"
                  maxLength={4}
                  placeholder="PIN 4 หลัก"
                  value={pin}
                  onChange={(e) => setPin(e.target.value.slice(0, 4))}
                  className="w-1/2 text-center tracking-widest text-lg font-mono px-3 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-400 text-white font-bold"
                />
                <button
                  onClick={handleJoinRoom}
                  className="w-1/2 py-3 bg-slate-700 hover:bg-slate-600 font-bold rounded-xl text-white text-sm active:scale-95 transition-all"
                >
                  เข้าห้อง
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Component: การ์ดของผู้เล่น ---
    function PlayerHand({ player, onSaveClue, onPlayCard, onEditCard, isSpectator }) {
      const [clueInput, setClueInput] = useState(player?.clue || '');

      useEffect(() => {
        if (player?.clue) setClueInput(player.clue);
      }, [player?.clue]);

      if (isSpectator || !player?.secret_number) {
        return (
          <div className="bg-slate-800/90 p-4 rounded-2xl border border-dashed border-amber-500/40 text-center mb-4">
            <div className="text-3xl mb-1">👁️</div>
            <h4 className="text-sm font-bold text-amber-400">คุณเป็นผู้ชมประจำรอบนี้</h4>
            <p className="text-xs text-slate-400 mt-1">คุณเข้าร่วมระหว่างรอบ กำลังรับชมความสนุกอยู่ (จะได้เล่นรอบถัดไป)</p>
          </div>
        );
      }

      const handleSave = (e) => {
        e.preventDefault();
        if (!clueInput.trim()) return;
        onSaveClue(clueInput.trim());
      };

      return (
        <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl mb-4">
          <div className="flex justify-between items-center mb-2">
            <div className="flex items-center gap-2">
              <span className="text-lg">{getAvatar(player.name)}</span>
              <span className="text-xs text-slate-300 font-bold">{player.name} (คุณ)</span>
            </div>
            <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-semibold">
              🔒 ตัวเลขลับของคุณ
            </span>
          </div>

          {/* การ์ดตัวเลขลับ */}
          <div className="relative mx-auto w-28 h-36 bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 rounded-xl shadow-2xl border-2 border-amber-300/50 flex flex-col justify-between p-3 text-slate-950 font-black mb-4 select-none transform hover:scale-105 transition-transform">
            <span className="text-base text-left leading-none">{player.secret_number}</span>
            <span className="text-4xl text-center font-black my-auto">{player.secret_number}</span>
            <span className="text-base text-right leading-none">{player.secret_number}</span>
          </div>

          {/* 2-Step Action: บันทึกคำใบ้ vs วางการ์ด */}
          {!player.has_played ? (
            <div className="space-y-3 pt-2 border-t border-slate-700/80">
              <form onSubmit={handleSave} className="space-y-2">
                <label className="block text-xs text-slate-400 text-left font-semibold">1. พิมพ์คำใบ้ของคุณ:</label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    placeholder="เช่น ช้าง, มด, ปากกา..."
                    value={clueInput}
                    onChange={(e) => setClueInput(e.target.value)}
                    className="flex-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-400 text-xs text-white"
                  />
                  <button
                    type="submit"
                    className="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-bold rounded-xl text-amber-300 active:scale-95 transition-all"
                  >
                    💾 บันทึก
                  </button>
                </div>
              </form>

              <div>
                <label className="block text-xs text-slate-400 text-left font-semibold mb-1">2. ยืนยันการวางการ์ดลงกระดาน:</label>
                <button
                  onClick={onPlayCard}
                  disabled={!player.clue}
                  className="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 disabled:opacity-30 disabled:pointer-events-none hover:from-emerald-400 hover:to-emerald-500 font-black rounded-xl text-slate-950 text-xs active:scale-95 transition-all shadow-md shadow-emerald-500/20"
                >
                  🃏 วางการ์ดคำใบ้ลงกระดานกลาง
                </button>
              </div>
            </div>
          ) : (
            <div className="space-y-2 pt-2 border-t border-slate-700/80">
              <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 text-xs font-semibold text-center">
                ✓ วางการ์ดลงกระดานแล้ว: <span className="text-sm font-bold text-amber-300">"{player.clue}"</span>
              </div>
              <button
                onClick={onEditCard}
                className="w-full py-1.5 bg-slate-700/80 hover:bg-slate-700 text-[11px] font-medium text-slate-300 rounded-lg active:scale-95 transition-all"
              >
                ✏️ แก้ไขคำใบ้ / ดึงการ์ดกลับ
              </button>
            </div>
          )}
        </div>
      );
    }

    // --- Component: กระดานเปิดเฉลยการ์ดทีละใบ (Sequential Reveal) ---
    function SharedPlayArea({ players, roomStatus, onRevealSingleCard, isHost }) {
      const playedCards = players
        .filter((p) => p.has_played && p.secret_number !== null)
        .sort((a, b) => a.order_index - b.order_index);

      // ค้นหาเลขที่เปิดเฉลยแล้ว เพื่อหาค่าสูงสุด
      const revealedCards = playedCards.filter((p) => p.is_revealed);
      const lastRevealed = revealedCards[revealedCards.length - 1];

      return (
        <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl">
          <div className="flex justify-between items-center mb-3">
            <h3 className="text-sm font-bold text-slate-200">กระดานการ์ดส่วนกลาง</h3>
            <span className="text-[11px] text-amber-400 font-semibold bg-amber-500/10 px-2 py-0.5 rounded-full border border-amber-500/20">
              🔥 เปิดทีละใบเพื่อลุ้น!
            </span>
          </div>

          {playedCards.length === 0 ? (
            <div className="py-8 text-center text-slate-500 text-xs border border-dashed border-slate-700 rounded-xl">
              ยังไม่มีใครวางการ์ดคำใบ้ลงกระดาน
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-3">
              {playedCards.map((card) => {
                const avatar = getAvatar(card.name);
                return (
                  <div
                    key={card.id}
                    className={`p-3 rounded-xl border flex flex-col justify-between transition-all duration-300 ${
                      card.is_revealed
                        ? 'bg-gradient-to-b from-amber-500/20 to-slate-900 border-amber-500/60 shadow-lg shadow-amber-500/10'
                        : 'bg-slate-900 border-slate-700 hover:border-slate-500'
                    }`}
                  >
                    <div>
                      <div className="flex items-center justify-between mb-1.5">
                        <span className="text-base">{avatar}</span>
                        <span className="text-[10px] font-bold text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full">{card.name}</span>
                      </div>
                      <p className="text-sm font-extrabold text-amber-300 my-1">"{card.clue}"</p>
                    </div>

                    {/* แสดงตัวเลขเมื่อเปิดการ์ดแล้ว / ปุ่มเปิดเฉลย */}
                    <div className="mt-3 pt-2 border-t border-slate-800 text-center">
                      {card.is_revealed ? (
                        <div className="text-2xl font-black text-amber-400 animate-pulse">
                          {card.secret_number}
                        </div>
                      ) : (
                        <button
                          onClick={() => onRevealSingleCard(card)}
                          className="w-full py-1.5 bg-amber-500 hover:bg-amber-400 active:scale-95 font-bold rounded-lg text-slate-950 text-xs shadow-md transition-all"
                        >
                          🔓 คลิกเปิดเฉลยใบนี้
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // --- Component: ระบบแชทประจำห้อง ---
    function ChatBox({ roomId, playerName }) {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [isOpen, setIsOpen] = useState(false);
      const chatEndRef = useRef(null);

      const fetchMessages = async () => {
        const { data } = await db.from('messages').select('*').eq('room_id', roomId).order('created_at', { ascending: true });
        if (data) setMessages(data);
      };

      useEffect(() => {
        fetchMessages();
        const channel = db
          .channel(`messages:${roomId}`)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` }, (payload) => {
            setMessages((prev) => [...prev, payload.new]);
          })
          .subscribe();

        return () => { db.removeChannel(channel); };
      }, [roomId]);

      useEffect(() => {
        if (isOpen) chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isOpen]);

      const handleSend = async (e) => {
        e.preventDefault();
        if (!input.trim()) return;
        const msg = input.trim();
        setInput('');
        await db.from('messages').insert([{ room_id: roomId, player_name: playerName, text: msg }]);
      };

      return (
        <div className="mt-4">
          <button
            onClick={() => setIsOpen(!isOpen)}
            className="w-full py-2.5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-xl flex items-center justify-between px-4 text-xs font-bold text-slate-300 transition-all"
          >
            <span className="flex items-center gap-2">
              💬 แชทพูดคุยปรึกษากัน <span className="px-2 py-0.5 bg-amber-500/20 text-amber-400 rounded-full text-[10px]">{messages.length}</span>
            </span>
            <span>{isOpen ? '▲ ซ่อน' : '▼ เปิดแชท'}</span>
          </button>

          {isOpen && (
            <div className="mt-2 bg-slate-900 border border-slate-700 rounded-xl p-3 space-y-3">
              <div className="h-40 overflow-y-auto space-y-2 pr-1 text-xs">
                {messages.length === 0 ? (
                  <p className="text-center text-slate-500 my-10">เริ่มพิมพ์พูดคุยวิเคราะห์คำใบ้ได้ตรงนี้!</p>
                ) : (
                  messages.map((m) => (
                    <div key={m.id} className={`flex flex-col ${m.player_name === playerName ? 'items-end' : 'items-start'}`}>
                      <span className="text-[10px] text-slate-500 mb-0.5">{m.player_name}</span>
                      <div className={`px-3 py-1.5 rounded-xl max-w-[80%] ${m.player_name === playerName ? 'bg-amber-500 text-slate-950 font-medium' : 'bg-slate-800 text-slate-200 border border-slate-700'}`}>
                        {m.text}
                      </div>
                    </div>
                  ))
                )}
                <div ref={chatEndRef} />
              </div>

              <form onSubmit={handleSend} className="flex gap-2">
                <input
                  type="text"
                  placeholder="พิมพ์ข้อความ..."
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  className="flex-1 px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-400"
                />
                <button type="submit" className="px-4 py-2 bg-amber-500 hover:bg-amber-400 font-bold text-slate-950 text-xs rounded-xl active:scale-95">
                  ส่ง
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    // --- Main Game Room ---
    function GameRoom({ session, onLeave }) {
      const { roomId, playerId, isHost, playerName } = session;
      const [room, setRoom] = useState(null);
      const [players, setPlayers] = useState([]);
      const [customTheme, setCustomTheme] = useState('');
      const [gameAlert, setGameAlert] = useState(null);

      const fetchData = async () => {
        const { data: roomData } = await db.from('rooms').select('*').eq('id', roomId).single();
        const { data: playersData } = await db.from('players').select('*').eq('room_id', roomId);
        if (roomData) setRoom(roomData);
        if (playersData) setPlayers(playersData);
      };

      useEffect(() => {
        fetchData();
        const channel = db
          .channel(`room:${roomId}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, () => fetchData())
          .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: `room_id=eq.${roomId}` }, () => fetchData())
          .subscribe();

        return () => { db.removeChannel(channel); };
      }, [roomId]);

      // บันทึกคำใบ้
      const handleSaveClue = async (clue) => {
        await db.from('players').update({ clue }).eq('id', playerId);
      };

      // วางการ์ดลงกระดาน
      const handlePlayCard = async () => {
        await db.from('players').update({ has_played: true, is_revealed: false }).eq('id', playerId);
      };

      // ดึงการ์ดกลับมาแก้ไข
      const handleEditCard = async () => {
        await db.from('players').update({ has_played: false, is_revealed: false }).eq('id', playerId);
      };

      // เริ่มเกม / รอบใหม่
      const handleStartGame = async () => {
        setGameAlert(null);
        const selectedTheme = customTheme.trim() || DEFAULT_THEMES[Math.floor(Math.random() * DEFAULT_THEMES.length)];
        const numbers = Array.from({ length: 100 }, (_, i) => i + 1).sort(() => Math.random() - 0.5);

        for (let i = 0; i < players.length; i++) {
          await db.from('players').update({
            secret_number: numbers[i],
            clue: '',
            has_played: false,
            is_revealed: false,
            order_index: i
          }).eq('id', players[i].id);
        }

        await db.from('rooms').update({ status: 'playing', theme: selectedTheme }).eq('id', roomId);
      };

      // รีเซ็ตห้อง
      const handleResetRoom = async () => {
        if (!confirm('คุณต้องการรีเซ็ตห้องกลับหน้า Lobby ใช่หรือไม่?')) return;
        setGameAlert(null);
        await db.from('rooms').update({ status: 'lobby', theme: '' }).eq('id', roomId);
        for (const p of players) {
          await db.from('players').update({
            secret_number: null,
            clue: '',
            has_played: false,
            is_revealed: false,
            order_index: 0
          }).eq('id', p.id);
        }
      };

      // เปิดเฉลยการ์ดทีละใบสุดลุ้น!
      const handleRevealSingleCard = async (targetCard) => {
        const revealedList = players.filter((p) => p.is_revealed).sort((a, b) => a.secret_number - b.secret_number);
        const lastMaxNumber = revealedList.length > 0 ? Math.max(...revealedList.map((p) => p.secret_number)) : 0;

        // อัปเดตเปิดการ์ด
        await db.from('players').update({ is_revealed: true }).eq('id', targetCard.id);

        // ตรวจสอบความถูกต้อง
        if (targetCard.secret_number < lastMaxNumber) {
          setGameAlert({
            type: 'error',
            title: '💥 พลาดแล้ว! เรียงผิดลำดับ!',
            message: `การ์ดของ ${targetCard.name} (${targetCard.secret_number}) น้อยกว่าการ์ดก่อนหน้า (${lastMaxNumber})`
          });
        } else {
          setGameAlert({
            type: 'success',
            title: '🎉 ถูกต้อง! ลุ้นกันต่อ!',
            message: `การ์ดของ ${targetCard.name} คือเลข (${targetCard.secret_number}) เรียงถูกต้อง!`
          });
        }
      };

      const currentPlayer = players.find((p) => p.id === playerId);
      const activePlayers = players.filter((p) => p.secret_number !== null);
      const playedCards = players.filter((p) => p.has_played && p.secret_number !== null);
      const isSpectator = room?.status !== 'lobby' && (!currentPlayer || currentPlayer.secret_number === null);

      if (!room) return <div className="p-6 text-center text-white text-sm">กำลังเชื่อมต่อห้อง...</div>;

      return (
        <div className="min-h-screen bg-slate-900 text-white p-4 max-w-md mx-auto">
          {/* Header */}
          <div className="flex justify-between items-center pb-3 border-b border-slate-800 mb-3">
            <div>
              <span className="text-xs text-slate-400">ห้อง PIN</span>
              <h2 className="text-xl font-mono font-bold text-amber-400">{roomId}</h2>
            </div>
            <div className="flex items-center gap-2">
              {isHost && (
                <button
                  onClick={handleResetRoom}
                  className="text-xs px-2.5 py-1.5 bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded-lg hover:bg-rose-500/30 font-semibold"
                >
                  🔄 Reset
                </button>
              )}
              <button onClick={onLeave} className="text-xs px-2.5 py-1.5 bg-slate-800 text-slate-400 rounded-lg hover:text-white font-semibold">
                ออก
              </button>
            </div>
          </div>

          {/* Player Count Bar */}
          <div className="flex justify-between items-center px-3 py-2 bg-slate-800/80 rounded-xl mb-3 text-xs text-slate-300 border border-slate-700/60">
            <span>👥 ผู้เล่น: <strong className="text-amber-400">{players.length}</strong> คน</span>
            {room.status !== 'lobby' && (
              <span>🃏 วางการ์ดแล้ว: <strong className="text-emerald-400">{playedCards.length}/{activePlayers.length}</strong> คน</span>
            )}
          </div>

          {/* Game Alert Message */}
          {gameAlert && (
            <div className={`p-3 mb-3 text-xs rounded-xl border text-center animate-bounce ${
              gameAlert.type === 'error' ? 'bg-rose-500/20 border-rose-500/50 text-rose-300' : 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300'
            }`}>
              <div className="font-bold text-sm mb-0.5">{gameAlert.title}</div>
              <div>{gameAlert.message}</div>
            </div>
          )}

          {/* Lobby State */}
          {room.status === 'lobby' && (
            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center space-y-4">
              <h3 className="text-sm font-bold text-slate-200">รายชื่อผู้เล่นที่อยู่ในห้อง ({players.length} คน)</h3>
              <div className="grid grid-cols-2 gap-2">
                {players.map((p) => (
                  <div key={p.id} className="p-2.5 bg-slate-900 border border-slate-700 rounded-xl flex items-center gap-2 text-xs">
                    <span className="text-lg">{getAvatar(p.name)}</span>
                    <span className="font-bold text-slate-200 truncate">{p.name} {p.id === room.host_id && '👑'}</span>
                  </div>
                ))}
              </div>

              {isHost ? (
                <div className="space-y-3 pt-2">
                  <input
                    type="text"
                    placeholder="พิมพ์ Theme เอง (หรือปล่อยว่างเพื่อสุ่ม)"
                    value={customTheme}
                    onChange={(e) => setCustomTheme(e.target.value)}
                    className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white"
                  />
                  <button
                    onClick={handleStartGame}
                    className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black rounded-xl text-sm shadow-lg shadow-amber-500/20 active:scale-95 transition-all"
                  >
                    🚀 เริ่มเกม!
                  </button>
                </div>
              ) : (
                <p className="text-xs text-slate-400 animate-pulse">รอ Host กดเริ่มเกม...</p>
              )}
            </div>
          )}

          {/* Playing State */}
          {room.status !== 'lobby' && (
            <div>
              <div className="bg-gradient-to-r from-amber-500/20 to-amber-600/20 border border-amber-500/40 p-3 rounded-xl mb-3 text-center">
                <span className="text-xs text-amber-300 font-semibold block">Theme ประจำรอบ</span>
                <span className="text-base font-black text-amber-400">"{room.theme}"</span>
              </div>

              <PlayerHand
                player={currentPlayer}
                onSaveClue={handleSaveClue}
                onPlayCard={handlePlayCard}
                onEditCard={handleEditCard}
                isSpectator={isSpectator}
              />

              <SharedPlayArea
                players={players}
                roomStatus={room.status}
                onRevealSingleCard={handleRevealSingleCard}
                isHost={isHost}
              />
            </div>
          )}

          {/* Live Chat Drawer */}
          <ChatBox roomId={roomId} playerName={playerName} />
        </div>
      );
    }

    function App() {
      const [session, setSession] = useState(null);
      return (
        <div className="min-h-screen bg-slate-950 font-sans">
          {!session ? (
            <Lobby onJoinRoom={(data) => setSession(data)} />
          ) : (
            <GameRoom session={session} onLeave={() => setSession(null)} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
